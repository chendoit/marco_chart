# 美元水管流動性：線上判定用的規則設定（liq_eval.py 讀這份）
# 由 analysis/美元水管流動性/backtest/rules.yaml 的主版本 v3_R6單獨亮黃 展開而來，各參數的理由寫在那份檔案。
# 改規則的流程：先改 backtest/rules.yaml 並重跑 backtest_rules.py，通過驗收後再同步這份；
# tests/test_rules.py 會檢查兩邊一致。
# 所有門檻都還沒校準（calibrated: false），第 1 階段為影子模式。
calibrated: false
source_variant: v3_R6單獨亮黃

quantile: {window: 250, min_periods: 120}
calendar:
  after_days: 1
  widen: {R1_bp: 3, R4a_bn: 10}
  t2_check: true
  refunding_months: []
rules:
  R1:
    enabled: true
    avail_lag: 1
    quantile_exclude_calendar: true
    levels:
      1: {q: 0.9, floor: 3, cap: null, consecutive: 2}
      2: {q: 0.95, floor: 5, cap: 10, mean_days: 5}
      3: {q: 0.99, floor: 8, cap: 15}
  R3:
    enabled: true
    avail_lag: 1
    quantile_exclude_calendar: false
    levels:
      1: {q: 0.95, floor: 4, cap: null}
      2: {q: 0.99, floor: 6, cap: null}
  R4a:
    enabled: true
    avail_lag: 0
    levels:
      1: {gt: 2}
      2: {gt: 10}
    rrp_guard: {quarter_end_only: true, rrp_bn_gt: 100}
  R6:
    enabled: true
    avail_lag: 0
    pre: {z_equity: -1.5, z_gold: -1.5}
    type2: {mode: dtb3, d10_bp_ge: 5, d3m_bp_le: -5}
light:
  funding_rules: [R1, R4a]
  r6_type2_alone: 1

# ---- v2：推播分級與投資效用（不屬於燈號規則，回測主版本比對只看 quantile/calendar/rules/light）----
notification:
  # 行動級：立即推播（影子模式只記 WOULD_NOTIFY_ACTION）。資訊級（只有融資面異常、沒傳導）只進每日摘要與 alerts.jsonl
  action_level:
    min_light: 2                # 至少橘燈
    consecutive_days: 2         # 橘燈以上要連續幾個交易日（過濾單日尖刺）
    require_r6: true            # 要有跨資產傳導（R6 >= 1）
    severe_rule_level: 3        # 例外：R1/R3/R4a 任一達這個等級，不需 R6 也算行動級（null = 不開例外）
  # 解除訊號：橘/紅 episode 降回綠燈並連續維持 cooldown_days 天（防綠一天又跳橘重複發報）
  recovery_alert:
    enabled: true
    from_min_light: 2
    cooldown_days: 3
    require_action_notified: true   # 只有當初發過行動級的 episode 才推播解除；否則降為資訊級
  fresh_days: 3                 # 只有最近幾個交易日內成立的事件才推播，更早的視為歷史

investment_utility:
  horizons: [1, 5, 20]          # 前瞻交易日 T+1、T+5、T+20
  assets: ["SPY", "QQQ", "GLD"]
  benchmark: "SPY"
  drawdown_threshold: -0.05     # 「後 20 日再跌超過 5%」的門檻
