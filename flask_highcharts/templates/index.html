<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prosperity Portal</title>
    <!-- 如果在static文件夾中 -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        function updateGroups() {
            fetch('/api/update_groups')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const groupList = document.getElementById('group-list');
                        groupList.innerHTML = ''; // 清空舊資料
                        data.chart_id_list.forEach(group_id => {
                            let groupElement = document.createElement('a');
                            groupElement.href = `/charts/${group_id}`;
                            groupElement.className = "block bg-white rounded-lg shadow-lg p-6 mb-4 text-gray-800 font-medium hover:bg-blue-600 hover:text-white transition-all transform hover:-translate-y-1";
                            groupElement.textContent = group_id;
                            groupList.appendChild(groupElement);
                        });
                    } else {
                        alert('更新失敗: ' + data.error);
                    }
                })
                .catch(error => console.error('Error updating groups:', error));
        }

        // 當點擊標題中的同步圖標時觸發更新
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.fa-sync-alt').addEventListener('click', updateGroups);
        });
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .refresh-icon {
            cursor: pointer;
            margin-left: 6px;  /* 縮小了左邊距 */
            font-size: 0.5em;  /* 使圖標變小，原始大小的70% */
            color: #6B7280;    /* 淺灰色 (Tailwind的gray-500) */
            transition: transform 0.5s, color 0.3s;
            vertical-align: middle;
        }

        .refresh-icon:hover {
            transform: rotate(180deg);
            color: #374151;    /* 深灰色 (Tailwind的gray-700) */
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-300 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
            Welcome to Prosperity Portal
            <i class="fas fa-sync-alt refresh-icon" title="更新Group列表"></i>
        </h1>

        <!-- Group 列表 -->
        <div id="group-list" class="max-w-2xl mx-auto">
            {% for group_id in chart_id_list %}
            <a href="/charts/{{ group_id }}" class="block bg-white rounded-lg shadow-lg p-6 mb-4 text-gray-800 font-medium hover:bg-blue-600 hover:text-white transition-all transform hover:-translate-y-1">
                {{ group_id }}
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
